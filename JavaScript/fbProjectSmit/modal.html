<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="modal.css">
    <title>Document</title>
</head>
<body>
    <div class="modalBox">
        <div class="modal">
            <header>
                <h2>Create Post</h2>
                <div class="cancel">
                    <i class="fa-solid fa-x"></i>
                </div>
            </header>
            <div class="name">
                <i class="fa-solid fa-circle-user"></i>
                <div class="nameFriends">
                    <p>Muhammad Ayan Hashmi</p>
                    <select name="Friend" id="">
                        <option auto>Friend</option>
                    </select>
                </div>
            </div>
            <div class="writePost">
                <textarea name="" id="postDescription" placeholder="What's On Your Mind,ayan? "></textarea>
            </div>
            <div class="emojiSection">
                <img height="38" class="xz74otr x15mokao x1ga7v0g x16uus16 xbiv7yw" alt="" referrerpolicy="origin-when-cross-origin" src="https://www.facebook.com/images/composer/SATP_Aa_square-2x.png">
                <i class="fa-regular fa-face-smile"></i>
            </div>
                <div class="itemPost">
                    <p>Add to your post</p>
                    <div class="itemPostLeft">
                        <img class="x1b0d499 xl1xv1r" alt="" src="https://static.xx.fbcdn.net/rsrc.php/v4/y7/r/Ivw7nhRtXyo.png?_nc_eui2=AeH6bIKYftOroOFAeoD1dlHLkBVQC4m7dx6QFVALibt3Hsg28pWg3x_erqA2c3sethicudJ_fwTE5tV9gEfw3RVg" >
                        <img class="x1b0d499 xl1xv1r" alt="" src="https://static.xx.fbcdn.net/rsrc.php/v4/yq/r/b37mHA1PjfK.png?_nc_eui2=AeFOIjcmKFFt-PXwPfoyUpAcc9ExYuivsM1z0TFi6K-wzZAekfBoHKAn9QAKE4VKYNQDoiBv1J64htrl86VX-ef-">
                        <img class="x1b0d499 xl1xv1r" alt="" src="https://static.xx.fbcdn.net/rsrc.php/v4/yd/r/Y4mYLVOhTwq.png?_nc_eui2=AeGplUTq2d_bi7qRnBd9FT21fPQ6N5_OUfV89Do3n85R9arW8Ddg1xrsYMwejWIVKahSB-j1ePVzNSnNaXTD4v89" >
                        <img class="x1b0d499 xl1xv1r" alt="" src="https://static.xx.fbcdn.net/rsrc.php/v4/y1/r/8zlaieBcZ72.png?_nc_eui2=AeFwkToC6yhCai5KPmbGntvcu7QmHo__KE27tCYej_8oTfMbKckrOjAThvvz0DaQMKe1iKhGwD_1Z30ZNxLozrTL">
                        <img class="x1b0d499 xl1xv1r" alt="" src="https://static.xx.fbcdn.net/rsrc.php/v4/yT/r/q7MiRkL7MLC.png?_nc_eui2=AeGBXWZbIVh2t8F8s4jmWA9qP2l9fgE6icQ_aX1-ATqJxOSy2yZIU17_iSgcyyxnk2d-ZpuTSw-b10FUGzjAL9Za" >
                        <i class="fa-solid fa-ellipsis"></i>
                    </div>
                </div>
                <div class="postBtn">
                    <button id="postBtn">Post</button>
                </div>
        </div>
    </div>
</body>
<script src="modal.js"></script>
</html>
